name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Non-interactive Corepack: yarn@4.9.1 comes from `packageManager`.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve Yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get globalFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Format check
        run: npx prettier --check src astro.config.mjs eslint.config.js

      - name: Unit tests
        run: yarn test

      # No page prerenders, so the build never talks to Medusa — the stub
      # only satisfies env parsing. Same battery as the release checklist.
      - name: Hermetic .env for the build
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^PUBLIC_MEDUSA_BACKEND_URL=.*|PUBLIC_MEDUSA_BACKEND_URL=http://127.0.0.1:9000|' \
            -e 's|^PUBLIC_MEDUSA_PUBLISHABLE_KEY=.*|PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_ci_placeholder|' \
            -e 's|^DEFAULT_REGION=.*|DEFAULT_REGION=vi|' \
            .env

      - name: Build
        run: yarn build
